name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    name: "the shipped examples are clean"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          models: "examples/side-table.js examples/bookshelf-3-shelf.js examples/dado-joint.js examples/drawer-box.js examples/slat-bench.js"

  expected-failure:
    name: "the loud fixture is still loud (expected to fail)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # These examples exist to be caught. Each one's README row names the rule it must report,
      # and the shipped `npm test` asserts the same thing on an installed copy.
      - id: loud
        continue-on-error: true
        uses: ./
        with:
          models: "examples/dado-interference.js"
      # ⚠⚠ THE POSITIVE CONTROL. Without this step the job above is green whether the fixture
      # failed, passed, or never ran — and a workflow that is green because nothing happened is
      # worse than no workflow, because it looks like evidence.
      - name: "…and it must actually have failed"
        shell: bash
        run: |
          if [ "${{ steps.loud.outcome }}" != "failure" ]; then
            echo "::error title=the control did not fail::examples/dado-interference.js was expected to FAIL verification and did not (outcome: ${{ steps.loud.outcome }}). The checks are not firing, so every green run beside this one is worthless."
            exit 1
          fi
          echo "The loud fixture failed verification, as it must — the check surface is alive."
