# GENERATED by scripts/export-cad-engine.mjs in the Axle Keys repository. Do not hand-edit —
# changes are made upstream and re-exported (this repo is a build output, not a fork).
#
# A thin wrapper. All of the logic lives in the CLI this runs: `axle verify` builds every
# matched model on ONE warm kernel and exits with the worst verdict it found. Nothing here
# parses a verdict or decides what "clean" means.
#
# version: packages/engine/package.json — and the publish stamp agrees, so this is on npm (published 2026-09-13)
name: "Axle Keys — verify CAD models"
description: "Build every parametric model in your repository with the Axle Keys engine and fail the run if the verdict is not clean."
author: "Axle Keys"
branding:
  icon: "box"
  color: "orange"

inputs:
  models:
    description: "Files or globs to verify, whitespace-separated — e.g. \"models/**/*.js\". Quote them: the engine expands the globs itself, so the pattern means the same thing on every runner. A pattern that matches no files FAILS the step rather than passing quietly."
    required: true
  version:
    description: "The version of @axle-keys/cad-engine to run. Defaults to the version this repository was exported beside, so the Action and the engine ship together."
    required: false
    default: "0.1.4"

runs:
  using: "composite"
  steps:
    - name: "Set up Node 24"
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: "axle verify"
      shell: bash
      # The inputs travel as ENV, never interpolated into the script: `${{ }}` inside a run
      # block is a shell-injection surface, and a models input is attacker-shaped the moment a
      # workflow builds it from anything but a literal.
      env:
        AXLE_MODELS: ${{ inputs.models }}
        AXLE_VERSION: ${{ inputs.version }}
      # `set -f` turns OFF the shell's own pathname expansion so the CLI does the globbing.
      # Without it bash expands the pattern first — with no globstar, so "models/**/*.js"
      # quietly means "models/*/*.js" — and the two doors disagree about which files were
      # checked. $AXLE_MODELS stays unquoted on purpose: several patterns split on whitespace.
      run: |
        set -f
        npm install -g "@axle-keys/cad-engine@$AXLE_VERSION"
        axle verify $AXLE_MODELS --github
